[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-smith"
version = "0.1.0"
description = "Local-first personal assistant with deterministic persona routing"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "pypdf>=4,<6", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.packages.find]
include = ["assistant_api*"]

[tool.setuptools.package-data]
assistant_api = ["pages/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
